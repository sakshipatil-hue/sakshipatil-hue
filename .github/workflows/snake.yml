name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: sakshipatil-hue
          outputs: |
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg

      - name: Commit generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update contribution snake"
          add: "assets/contribution-snake.svg assets/contribution-snake-dark.svg"
